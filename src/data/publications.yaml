# Publications, in the order they should appear (newest first).
# No year grouping — just list them.
#
# Fields:
#   title:    required
#   authors:  list; names in site.ts `authorNames` are bolded. Add "*" for
#             equal contribution, e.g. "Prateek Arora*".
#   venue:    e.g. "IEEE International Conference on Robotics and Automation (ICRA), 2025"
#   award:    optional highlight tag, e.g. "Best Paper Finalist"
#   media:    optional, shown on the left:
#               video:  looping clip in public/media/papers/ → "/media/papers/foo.mp4"
#                       (convert GIFs with: scripts/gif-to-mp4.sh input.gif)
#               image:  still image in src/assets/papers/ → "foo.png"
#                       (with a video, the image is used as its poster frame)
#   links:    all optional; only the ones you fill in get a button
#               paper, code, website, video: URLs
#               bibtex: the BibTeX entry (multi-line, use the "|" block style) —
#                       its button copies it to the clipboard
#

# Example (copy, uncomment, edit):
#
# - title: "Your Paper Title"
#   authors: ["Prateek Arora", "Co Author", "Christos Papachristos"]
#   venue: "IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS), 2025"
#   award: "Oral"
#   media:
#     video: /media/papers/your-paper.mp4
#     image: your-paper.jpg
#   links:
#     paper: https://arxiv.org/abs/xxxx.xxxxx
#     code: https://github.com/pratiquea/your-repo
#     website: https://your-project-page.github.io
#     video: https://youtu.be/xxxx
#     bibtex: |
#       @inproceedings{arora2025paper, ...}
#
# Entries below were imported from Google Scholar (citations.csv). Add media,
# links and awards to each as you go.

