# Projects (manual entries), in display order. Pre-filled with the 18 course
# projects from the old site. GitHub repos tagged with the topic set in
# site.ts (default "showcase") are appended automatically at build time.
#
# Fields:
#   title, description: required
#   tag:    category chip, e.g. "Aerial Robotics"
#   image:  thumbnail in src/assets/projects/ (optional)
#   video:  optional looping clip in public/media/projects/ → "/media/projects/foo.mp4"
#           (plays when the card scrolls into view; `image` becomes its poster)
#   code:   URL for the "Code" button (optional)

